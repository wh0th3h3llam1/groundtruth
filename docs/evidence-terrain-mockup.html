<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Evidence Terrain mockup</title>
<style>
  :root { --bg: #0E0E0C; --text: #E8E2D4; --muted: #8F897C; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }
  p { color: var(--muted); }
  canvas { display: block; width: 100%; height: 420px; border-radius: 8px; background: #121210; }
</style>
</head>
<body>
<main>
  <h1>Evidence terrain (approved concept)</h1>
  <p>Mock data. Green peaks = supported claims, red pits = contradicted claims, blue flags = strongest sources. Reference for components/EvidenceTerrain.tsx.</p>
  <canvas id="c"></canvas>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv = document.getElementById("c");
const w = cv.clientWidth, h = cv.clientHeight;
const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(w, h, false); r.setClearColor(0x121210);
const s = new THREE.Scene();
const c = new THREE.PerspectiveCamera(36, w / h, 0.1, 200); c.position.set(0, 6, 10); c.lookAt(0, 0, 0);
s.add(new THREE.AmbientLight(0xffffff, 0.5));
const d = new THREE.DirectionalLight(0xfff2dc, 1); d.position.set(-5, 8, 6); s.add(d);

// [x, z, amplitude]: positive = supported peak, negative = contradicted pit
const claims = [[-4.5, -1, 1.6], [-1.5, 1.2, 1.2], [1.5, -0.8, -1.1], [4.3, 1, 0.6], [0, 2.6, -0.6]];
const geo = new THREE.PlaneGeometry(14, 8, 120, 70); geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position, cols = [];
const G = new THREE.Color(0x3FB68B), R = new THREE.Color(0xE4572E), N = new THREE.Color(0x3a3a34);
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  let y = 0;
  claims.forEach(([bx, bz, a]) => { y += a * Math.exp(-((x - bx) ** 2 + (z - bz) ** 2) / 1.6); });
  y += Math.sin(x * 1.7) * Math.cos(z * 1.3) * 0.05;
  pos.setY(i, y);
  const col = y > 0 ? N.clone().lerp(G, Math.min(1, y / 1.3)) : N.clone().lerp(R, Math.min(1, -y / 0.9));
  cols.push(col.r, col.g, col.b);
}
geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
geo.computeVertexNormals();
const grp = new THREE.Group(); s.add(grp);
grp.add(new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, flatShading: true })));
grp.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000, wireframe: true, transparent: true, opacity: 0.12 })));
claims.filter(cl => cl[2] > 0).forEach(([x, z, a]) => {
  const pin = new THREE.Group(); pin.position.set(x, a, z); grp.add(pin);
  const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.8, 6), new THREE.MeshStandardMaterial({ color: 0xE8E2D4 }));
  stick.position.y = 0.4; pin.add(stick);
  const flag = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.2, 0.02), new THREE.MeshBasicMaterial({ color: 0x5B9DFF }));
  flag.position.set(0.18, 0.7, 0); pin.add(flag);
});
let t = 0;
(function loop() { t += 0.016; if (!reduce) grp.rotation.y = Math.sin(t * 0.2) * 0.35; r.render(s, c); requestAnimationFrame(loop); })();
</script>
</body>
</html>
